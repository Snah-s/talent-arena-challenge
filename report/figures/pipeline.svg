<svg xmlns="http://www.w3.org/2000/svg" width="980" height="470" viewBox="0 0 980 470" font-family="Liberation Sans, Arial, Helvetica, sans-serif" fill="#1f2933"><rect width="980" height="470" fill="#ffffff"></rect><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8794"></path></marker><marker id="arrow-home" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6db3"></path></marker><marker id="arrow-away" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c8611c"></path></marker><marker id="arrow-dead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"></path></marker><marker id="arrow-train" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f7d4f"></path></marker></defs><rect x="10" y="10" width="960" height="150" rx="10" fill="none" stroke="#2f7d4f" stroke-width="1.2" stroke-dasharray="5 4"></rect><text x="22" y="24" dy="0.35em" text-anchor="start" font-size="12" fill="#2f7d4f" font-weight="700">TRAINING AND TUNING: external DFL bench only (CC BY 4.0)</text><rect x="10" y="178" width="960" height="282" rx="10" fill="none" stroke="#2f6db3" stroke-width="1.2" stroke-dasharray="5 4"></rect><text x="22" y="192" dy="0.35em" text-anchor="start" font-size="12" fill="#2f6db3" font-weight="700">INFERENCE: challenge game (models only run, nothing fitted)</text><rect x="28" y="42" width="200" height="100" rx="6" fill="#e8f3ec" stroke="#9fd0b1" stroke-width="1.2"></rect><text x="128" y="68.6" dy="0.35em" text-anchor="middle" font-size="13" font-weight="700" fill="#2f7d4f">Sportec Open DFL</text><text x="128" y="84.19999999999999" dy="0.35em" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2933">7 Bundesliga matches</text><text x="128" y="99.8" dy="0.35em" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2933">TRACAB 25 Hz</text><text x="128" y="115.4" dy="0.35em" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2933">BallStatus, BallPossession</text><rect x="262" y="42" width="200" height="100" rx="6" fill="#e8f3ec" stroke="#9fd0b1" stroke-width="1.2"></rect><text x="362" y="68.6" dy="0.35em" text-anchor="middle" font-size="13" font-weight="700" fill="#2f7d4f">Label rule</text><text x="362" y="84.19999999999999" dy="0.35em" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2933">controlled possession:</text><text x="362" y="99.8" dy="0.35em" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2933">a switch counts after 2 s</text><text x="362" y="115.4" dy="0.35em" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2933">D where the ball is dead</text><rect x="496" y="42" width="210" height="100" rx="6" fill="#e8f3ec" stroke="#9fd0b1" stroke-width="1.2"></rect><text x="601" y="68.6" dy="0.35em" text-anchor="middle" font-size="13" font-weight="700" fill="#2f7d4f">Degraded copies (x2)</text><text x="601" y="84.19999999999999" dy="0.35em" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2933">ball gaps 20-60 %, noise,</text><text x="601" y="99.8" dy="0.35em" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2933">missing players, phantoms,</text><text x="601" y="115.4" dy="0.35em" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2933">pseudo Smart Tagging</text><rect x="740" y="42" width="212" height="100" rx="6" fill="#e8f3ec" stroke="#9fd0b1" stroke-width="1.2"></rect><text x="846" y="68.6" dy="0.35em" text-anchor="middle" font-size="13" font-weight="700" fill="#2f7d4f">Fit, leave one match out</text><text x="846" y="84.19999999999999" dy="0.35em" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2933">gradient-boosted heads</text><text x="846" y="99.8" dy="0.35em" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2933">neural owner head (GPU)</text><text x="846" y="115.4" dy="0.35em" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2933">decoder grid: alpha, durations</text><path d="M228,92L260,92" fill="none" stroke="#2f7d4f" stroke-width="1.5" marker-end="url(#arrow-train)"></path><path d="M462,92L494,92" fill="none" stroke="#2f7d4f" stroke-width="1.5" marker-end="url(#arrow-train)"></path><path d="M706,92L738,92" fill="none" stroke="#2f7d4f" stroke-width="1.5" marker-end="url(#arrow-train)"></path><rect x="28" y="210" width="190" height="62" rx="6" fill="#f5f7fa" stroke="#cbd2d9" stroke-width="1.2"></rect><text x="123" y="233.2" dy="0.35em" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2933">Tracking (ATD)</text><text x="123" y="248.79999999999998" dy="0.35em" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2933">ball missing on 41 % of frames</text><rect x="28" y="286" width="190" height="62" rx="6" fill="#f5f7fa" stroke="#cbd2d9" stroke-width="1.2"></rect><text x="123" y="309.2" dy="0.35em" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2933">Smart Tagging</text><text x="123" y="324.8" dy="0.35em" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2933">set pieces, kick-off</text><rect x="28" y="362" width="190" height="82" rx="6" fill="#f3ecfa" stroke="#c9b3e6" stroke-width="1.2"></rect><text x="123" y="387.4" dy="0.35em" text-anchor="middle" font-size="13" font-weight="700" fill="#6b46a3">Tactical video</text><text x="123" y="403" dy="0.35em" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2933">WASB detector (GPU),</text><text x="123" y="418.59999999999997" dy="0.35em" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2933">only in the ATD's ball gaps</text><rect x="248" y="362" width="170" height="82" rx="6" fill="#f3ecfa" stroke="#c9b3e6" stroke-width="1.2"></rect><text x="333" y="387.4" dy="0.35em" text-anchor="middle" font-size="13" font-weight="700" fill="#6b46a3">Ball fill</text><text x="333" y="403" dy="0.35em" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2933">homography + fixed rules,</text><text x="333" y="418.59999999999997" dy="0.35em" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2933">never overwrites ATD</text><rect x="448" y="236" width="160" height="110" rx="6" fill="#f5f7fa" stroke="#cbd2d9" stroke-width="1.2"></rect><text x="528" y="267.6" dy="0.35em" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2933">Per-frame features</text><text x="528" y="283.20000000000005" dy="0.35em" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2933">37 symmetric</text><text x="528" y="298.8" dy="0.35em" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2933">34 antisymmetric</text><text x="528" y="314.40000000000003" dy="0.35em" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2933">(team swap)</text><rect x="640" y="210" width="150" height="58" rx="6" fill="#eceef1" stroke="#b8bec6" stroke-width="1.2"></rect><text x="715" y="231.2" dy="0.35em" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2933">q = P(alive)</text><text x="715" y="246.79999999999998" dy="0.35em" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2933">gradient boosting</text><rect x="640" y="282" width="150" height="84" rx="6" fill="#e3eefa" stroke="#a9c6ea" stroke-width="1.2"></rect><text x="715" y="308.4" dy="0.35em" text-anchor="middle" font-size="13" font-weight="700" fill="#2f6db3">r = P(home | alive)</text><text x="715" y="324" dy="0.35em" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2933">gradient boosting</text><text x="715" y="339.59999999999997" dy="0.35em" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2933">+ neural head, w = 0.75</text><rect x="820" y="210" width="136" height="156" rx="6" fill="#f5f7fa" stroke="#cbd2d9" stroke-width="1.2"></rect><text x="888" y="256.8" dy="0.35em" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2933">4-state HMM</text><text x="888" y="272.40000000000003" dy="0.35em" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2933">live/dead</text><text x="888" y="288" dy="0.35em" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2933">x home/away,</text><text x="888" y="303.6" dy="0.35em" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2933">min. durations,</text><text x="888" y="319.20000000000005" dy="0.35em" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2933">Viterbi per half</text><rect x="820" y="392" width="136" height="52" rx="6" fill="#f5f7fa" stroke="#cbd2d9" stroke-width="1.2"></rect><text x="888" y="410.2" dy="0.35em" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2933">frame,label</text><text x="888" y="425.8" dy="0.35em" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2933">H / A / D / X</text><path d="M218,241L446,266" fill="none" stroke="#7b8794" stroke-width="1.5" marker-end="url(#arrow)"></path><path d="M218,317L446,301" fill="none" stroke="#7b8794" stroke-width="1.5" marker-end="url(#arrow)"></path><path d="M218,403L246,403" fill="none" stroke="#6b46a3" stroke-width="1.5" marker-end="url(#arrow)"></path><path d="M333,362L333,326L446,326" fill="none" stroke="#6b46a3" stroke-width="1.5" marker-end="url(#arrow)"></path><path d="M608,266L638,239" fill="none" stroke="#7b8794" stroke-width="1.5" marker-end="url(#arrow)"></path><path d="M608,316L638,324" fill="none" stroke="#7b8794" stroke-width="1.5" marker-end="url(#arrow)"></path><path d="M790,239L818,239" fill="none" stroke="#7b8794" stroke-width="1.5" marker-end="url(#arrow)"></path><path d="M790,324L818,324" fill="none" stroke="#7b8794" stroke-width="1.5" marker-end="url(#arrow)"></path><path d="M888,366L888,390" fill="none" stroke="#7b8794" stroke-width="1.5" marker-end="url(#arrow)"></path><path d="M806,142L806,190L715,190L715,208" fill="none" stroke="#2f7d4f" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow-train)"></path><path d="M886,142L886,190L918,190L918,208" fill="none" stroke="#2f7d4f" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow-train)"></path><text x="820" y="201" dy="0.35em" text-anchor="middle" font-size="10.5" fill="#2f7d4f" font-weight="400" font-style="italic">trained heads and parameters</text></svg>
