<svg xmlns="http://www.w3.org/2000/svg" width="980" height="400" viewBox="0 0 980 400" font-family="Liberation Sans, Arial, Helvetica, sans-serif" fill="#1f2933"><rect width="980" height="400" fill="#ffffff"></rect><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8794"></path></marker><marker id="arrow-home" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6db3"></path></marker><marker id="arrow-away" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c8611c"></path></marker><marker id="arrow-dead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"></path></marker><marker id="arrow-train" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f7d4f"></path></marker></defs><rect x="10" y="10" width="600" height="380" rx="10" fill="none" stroke="#52606d" stroke-width="1.2" stroke-dasharray="5 4"></rect><text x="22" y="24" dy="0.35em" text-anchor="start" font-size="12" fill="#52606d" font-weight="700">PER 5 FPS STEP (shared weights)</text><rect x="626" y="10" width="344" height="380" rx="10" fill="none" stroke="#52606d" stroke-width="1.2" stroke-dasharray="5 4"></rect><text x="638" y="24" dy="0.35em" text-anchor="start" font-size="12" fill="#52606d" font-weight="700">OVER A 10 s WINDOW (50 steps)</text><rect x="28" y="48" width="150" height="70" rx="6" fill="#f5f7fa" stroke="#cbd2d9" stroke-width="1.2"></rect><text x="103" y="67.4" dy="0.35em" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2933">Ball token</text><text x="103" y="83" dy="0.35em" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2933">position, velocity,</text><text x="103" y="98.60000000000001" dy="0.35em" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2933">seen, time since seen</text><rect x="28" y="140" width="150" height="100" rx="6" fill="#e3eefa" stroke="#a9c6ea" stroke-width="1.2"></rect><text x="103" y="166.6" dy="0.35em" text-anchor="middle" font-size="13" font-weight="700" fill="#2f6db3">Home players</text><text x="103" y="182.2" dy="0.35em" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2933">up to 14 tokens,</text><text x="103" y="197.8" dy="0.35em" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2933">nearest to the ball first</text><text x="103" y="213.4" dy="0.35em" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2933">7 features each</text><rect x="28" y="262" width="150" height="100" rx="6" fill="#fcebdc" stroke="#f0c29f" stroke-width="1.2"></rect><text x="103" y="288.6" dy="0.35em" text-anchor="middle" font-size="13" font-weight="700" fill="#c8611c">Away players</text><text x="103" y="304.20000000000005" dy="0.35em" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2933">up to 14 tokens,</text><text x="103" y="319.8" dy="0.35em" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2933">nearest to the ball first</text><text x="103" y="335.40000000000003" dy="0.35em" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2933">7 features each</text><rect x="206" y="120" width="120" height="140" rx="6" fill="#f5f7fa" stroke="#cbd2d9" stroke-width="1.2"></rect><text x="266" y="158.8" dy="0.35em" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2933">Embedding</text><text x="266" y="174.4" dy="0.35em" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2933">2-layer MLP</text><text x="266" y="190" dy="0.35em" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2933">d = 64</text><text x="266" y="205.60000000000002" dy="0.35em" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2933">+ team</text><text x="266" y="221.20000000000002" dy="0.35em" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2933">embedding</text><rect x="354" y="100" width="110" height="180" rx="6" fill="#f5f7fa" stroke="#cbd2d9" stroke-width="1.2"></rect><text x="409" y="143.2" dy="0.35em" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2933">Transformer</text><text x="409" y="158.79999999999998" dy="0.35em" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2933">encoder layer</text><text x="409" y="174.39999999999998" dy="0.35em" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2933">self-attention</text><text x="409" y="190" dy="0.35em" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2933">over 1 + 28</text><text x="409" y="205.6" dy="0.35em" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2933">tokens,</text><text x="409" y="221.2" dy="0.35em" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2933">4 heads,</text><text x="409" y="236.8" dy="0.35em" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2933">padding mask</text><rect x="490" y="110" width="104" height="160" rx="6" fill="#f5f7fa" stroke="#cbd2d9" stroke-width="1.2"></rect><text x="542" y="158.8" dy="0.35em" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2933">Readout</text><text x="542" y="174.4" dy="0.35em" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2933">ball token</text><text x="542" y="190" dy="0.35em" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2933">|| mean(home)</text><text x="542" y="205.60000000000002" dy="0.35em" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2933">|| mean(away)</text><text x="542" y="221.20000000000002" dy="0.35em" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2933">= 192</text><path d="M178,83L204,134" fill="none" stroke="#7b8794" stroke-width="1.5" marker-end="url(#arrow)"></path><path d="M178,190L204,190" fill="none" stroke="#7b8794" stroke-width="1.5" marker-end="url(#arrow)"></path><path d="M178,312L204,246" fill="none" stroke="#7b8794" stroke-width="1.5" marker-end="url(#arrow)"></path><path d="M326,190L352,190" fill="none" stroke="#7b8794" stroke-width="1.5" marker-end="url(#arrow)"></path><path d="M464,190L488,190" fill="none" stroke="#7b8794" stroke-width="1.5" marker-end="url(#arrow)"></path><rect x="644" y="300" width="46" height="30" rx="4" fill="#f5f7fa" stroke="#cbd2d9"></rect><text x="667" y="315" dy="0.35em" text-anchor="middle" font-size="11" fill="#1f2933" font-weight="400">t1</text><rect x="706" y="300" width="46" height="30" rx="4" fill="#f5f7fa" stroke="#cbd2d9"></rect><text x="729" y="315" dy="0.35em" text-anchor="middle" font-size="11" fill="#1f2933" font-weight="400">t2</text><rect x="768" y="300" width="46" height="30" rx="4" fill="#f5f7fa" stroke="#cbd2d9"></rect><text x="791" y="315" dy="0.35em" text-anchor="middle" font-size="11" fill="#1f2933" font-weight="400">t3</text><rect x="830" y="300" width="46" height="30" rx="4" fill="#f5f7fa" stroke="#cbd2d9"></rect><text x="853" y="315" dy="0.35em" text-anchor="middle" font-size="11" fill="#1f2933" font-weight="400">...</text><rect x="892" y="300" width="46" height="30" rx="4" fill="#f5f7fa" stroke="#cbd2d9"></rect><text x="915" y="315" dy="0.35em" text-anchor="middle" font-size="11" fill="#1f2933" font-weight="400">t50</text><path d="M594,190L610,190L610,315L642,315" fill="none" stroke="#7b8794" stroke-width="1.5" marker-end="url(#arrow)"></path><rect x="644" y="206" width="294" height="60" rx="6" fill="#f5f7fa" stroke="#cbd2d9" stroke-width="1.2"></rect><text x="791" y="228.2" dy="0.35em" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2933">Bidirectional LSTM</text><text x="791" y="243.79999999999998" dy="0.35em" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2933">hidden 64 x 2</text><path d="M667,300L667,268" fill="none" stroke="#7b8794" stroke-width="1.5" marker-end="url(#arrow)"></path><path d="M729,300L729,268" fill="none" stroke="#7b8794" stroke-width="1.5" marker-end="url(#arrow)"></path><path d="M791,300L791,268" fill="none" stroke="#7b8794" stroke-width="1.5" marker-end="url(#arrow)"></path><path d="M853,300L853,268" fill="none" stroke="#7b8794" stroke-width="1.5" marker-end="url(#arrow)"></path><path d="M915,300L915,268" fill="none" stroke="#7b8794" stroke-width="1.5" marker-end="url(#arrow)"></path><rect x="644" y="128" width="140" height="56" rx="6" fill="#f5f7fa" stroke="#cbd2d9" stroke-width="1.2"></rect><text x="714" y="148.2" dy="0.35em" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2933">Linear</text><text x="714" y="163.79999999999998" dy="0.35em" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2933">logit f(x) per step</text><rect x="800" y="116" width="156" height="80" rx="6" fill="#e3eefa" stroke="#a9c6ea" stroke-width="1.2"></rect><text x="878" y="140.4" dy="0.35em" text-anchor="middle" font-size="13" font-weight="700" fill="#2f6db3">Team antisymmetry</text><text x="878" y="156" dy="0.35em" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2933">1/2 [f(x) - f(swap x)]</text><text x="878" y="171.60000000000002" dy="0.35em" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2933">exact by construction</text><path d="M714,206L714,186" fill="none" stroke="#7b8794" stroke-width="1.5" marker-end="url(#arrow)"></path><path d="M784,156L798,156" fill="none" stroke="#7b8794" stroke-width="1.5" marker-end="url(#arrow)"></path><rect x="644" y="40" width="312" height="60" rx="6" fill="#f5f7fa" stroke="#cbd2d9" stroke-width="1.2"></rect><text x="800" y="62.2" dy="0.35em" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2933">r_nn = P(home | alive)</text><text x="800" y="77.80000000000001" dy="0.35em" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2933">windows overlap by 5 s; 3 seeds averaged in log-odds</text><path d="M878,116L878,102" fill="none" stroke="#7b8794" stroke-width="1.5" marker-end="url(#arrow)"></path></svg>
